; Beelieve hive sensor node — ESP32 firmware
;
; Build:  pio run
; Flash:  pio run -t upload
; Logs:   pio device monitor
;
; Configuration (WiFi / MQTT / identifiers) comes either from build_flags below
; or from include/secrets.h (copy include/secrets.h.example -> include/secrets.h).
; build_flags take precedence over secrets.h.

[env:esp32dev]
platform = espressif32@^6.7.0
board = esp32dev
framework = arduino
monitor_speed = 115200
monitor_filters = esp32_exception_decoder, time
board_build.filesystem = littlefs

build_flags =
    -DCORE_DEBUG_LEVEL=0
    ; Uncomment for verbose serial debug logging:
    ; -DDEBUG
    ; Configuration may be injected here instead of include/secrets.h, e.g.:
    ; '-DWIFI_SSID="MyNetwork"'
    ; '-DWIFI_PASS="MyPassword"'
    ; '-DMQTT_HOST="192.168.1.10"'
    ; '-DHIVE_ID="KZ-ALA-0042"'
    ; '-DAPIARY_ID="apiary-almaty-01"'
    ; '-DTELEMETRY_INTERVAL_S=600'

lib_deps =
    knolleary/PubSubClient@^2.8
    bblanchon/ArduinoJson@^7.0.4
    adafruit/Adafruit SHT31 Library@^2.2.2
    adafruit/DHT sensor library@^1.4.6
    adafruit/Adafruit Unified Sensor@^1.1.14
    adafruit/Adafruit BusIO@^1.16.1
    bogde/HX711@^0.7.5
    paulstoffregen/OneWire@^2.3.8
    milesburton/DallasTemperature@^3.11.0
