version: "3.9"

x-env: &default-env
  env_file: .env

services:
  mosquitto:
    image: eclipse-mosquitto:2
    volumes:
      - ./infra/mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
    ports:
      - "1883:1883"
      - "9001:9001"
    healthcheck:
      test: ["CMD-SHELL", "mosquitto_sub -t '$$SYS/#' -C 1 -W 3 >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  kafka:
    image: bitnami/kafka:3.7
    environment:
      KAFKA_CFG_NODE_ID: "1"
      KAFKA_CFG_PROCESS_ROLES: broker,controller
      KAFKA_CFG_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_CFG_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093,EXTERNAL://:9094
      KAFKA_CFG_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,EXTERNAL://localhost:9094
      KAFKA_CFG_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_CFG_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CFG_AUTO_CREATE_TOPICS_ENABLE: "false"
    ports:
      - "9094:9094"
    healthcheck:
      test: ["CMD-SHELL", "kafka-topics.sh --bootstrap-server localhost:9092 --list >/dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 10

  kafka-init:
    image: bitnami/kafka:3.7
    depends_on:
      kafka:
        condition: service_healthy
    entrypoint: ["/bin/bash", "-c"]
    command:
      - |
        for t in hive.telemetry.raw hive.telemetry.enriched hive.predictions hive.alerts hive.telemetry.dlq; do
          kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists \
            --topic "$$t" --partitions 6 --replication-factor 1
        done

  timescaledb:
    image: timescale/timescaledb:latest-pg16
    <<: *default-env
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-beelieve}
      POSTGRES_USER: ${POSTGRES_USER:-beelieve}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-CHANGE_ME}
    volumes:
      - timescale-data:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d:ro
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10

  ingestion:
    build: ./services/ingestion
    <<: *default-env
    depends_on:
      mosquitto:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
    restart: unless-stopped

  stream-processor:
    build: ./services/stream-processor
    <<: *default-env
    depends_on:
      kafka-init:
        condition: service_completed_successfully
      timescaledb:
        condition: service_healthy
    restart: unless-stopped

  ml-inference:
    build: ./services/ml
    <<: *default-env
    volumes:
      - ./services/ml/models:/models
    depends_on:
      kafka-init:
        condition: service_completed_successfully
    restart: unless-stopped

  recommender:
    build: ./services/recommender
    <<: *default-env
    ports:
      - "8100:8100"
    depends_on:
      timescaledb:
        condition: service_healthy
    restart: unless-stopped

  api:
    build: ./services/api
    <<: *default-env
    ports:
      - "8000:8000"
    depends_on:
      kafka-init:
        condition: service_completed_successfully
      timescaledb:
        condition: service_healthy
    restart: unless-stopped

  hive-simulator:
    build: ./services/simulator
    <<: *default-env
    profiles: ["dev"]
    depends_on:
      mosquitto:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build: ./frontend
    ports:
      - "3030:80"
    depends_on:
      - api

volumes:
  timescale-data:
